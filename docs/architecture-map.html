<title>AMARU · Mapa de arquitectura</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-2: #fbfbfe;
    --ink: #14161f;
    --ink-soft: #565c72;
    --ink-faint: #868ca3;
    --line: #e3e5ef;
    --line-strong: #c9cddd;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --edge: #b9bed2;
    --shadow: 0 1px 2px rgba(18, 20, 33, .06), 0 8px 24px rgba(18, 20, 33, .06);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f16;
      --panel: #151824;
      --panel-2: #1b1f2e;
      --ink: #eceef6;
      --ink-soft: #a7adc4;
      --ink-faint: #767d96;
      --line: #262b3c;
      --line-strong: #39405a;
      --accent: #8b8cff;
      --accent-soft: #23264a;
      --edge: #3b4159;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: var(--mono); font-size: .85em; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand strong { font-size: 16px; letter-spacing: -.01em; }
  .brand span { color: var(--ink-faint); font-size: 13px; }
  .stat { color: var(--ink-soft); font-size: 12.5px; }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .control {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    background: var(--panel-2); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .control:hover { border-color: var(--line-strong); color: var(--ink); }
  .control:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.control { cursor: text; min-width: 180px; }

  .body { display: flex; flex: 1; min-height: 0; }

  .canvas {
    position: relative; flex: 1; min-width: 0; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 28px 28px;
    cursor: grab;
  }
  .canvas.dragging { cursor: grabbing; }
  .viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .viewport svg { position: absolute; inset: 0; overflow: visible; }

  .lane-label {
    position: absolute; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-faint); white-space: nowrap;
  }

  .node {
    position: absolute; padding: 9px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
    transition: opacity .18s, box-shadow .18s, transform .18s, border-color .18s;
  }
  .node::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--dot);
  }
  .node b {
    display: block; font-size: 13px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node small {
    display: block; margin-top: 2px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node .step-badge {
    position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
    display: none; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; box-shadow: var(--shadow);
  }
  .node:hover { transform: translateY(-1px); border-color: var(--line-strong); }
  .node.dim { opacity: .16; box-shadow: none; }
  .node.active { border-color: var(--dot); box-shadow: 0 0 0 2px color-mix(in srgb, var(--dot) 35%, transparent), var(--shadow); }
  .node.active .step-badge { display: flex; }
  .node.hit { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }

  path.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: opacity .18s, stroke .18s, stroke-width .18s; }
  path.edge.dim { opacity: .07; }
  path.edge.active { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 5; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  .edge-label { font-size: 9.5px; fill: var(--ink-faint); opacity: 0; transition: opacity .18s; pointer-events: none; }
  .edge-label.active { opacity: 1; fill: var(--accent); font-weight: 600; }

  aside.flows {
    width: 380px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); min-height: 0;
  }
  .flows-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .flows-head h2 { margin: 0 0 4px; font-size: 14px; letter-spacing: -.01em; }
  .flows-head p { margin: 0; font-size: 12.5px; color: var(--ink-faint); }
  .flows-list { overflow-y: auto; padding: 10px; flex: 1; }

  .flow { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel-2); overflow: hidden; }
  .flow.open { border-color: var(--accent); }
  .flow > button {
    display: block; width: 100%; text-align: left; padding: 11px 13px;
    background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
  }
  .flow > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .flow-name { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .flow-name .idx {
    flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .flow-purpose { margin: 4px 0 0 28px; font-size: 12.5px; color: var(--ink-soft); }
  .flow-trigger { margin: 6px 0 0 28px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }

  .steps { list-style: none; margin: 0; padding: 2px 13px 13px 13px; border-top: 1px dashed var(--line); }
  .steps li { display: flex; gap: 10px; padding: 7px 0; }
  .steps li + li { border-top: 1px solid var(--line); }
  .steps .n {
    flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%;
    display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
    background: color-mix(in srgb, var(--dot) 18%, transparent); color: var(--dot);
  }
  .steps .txt { min-width: 0; }
  .steps .txt b { display: block; font-size: 12.5px; font-weight: 600; }
  .steps .txt span { display: block; font-size: 12px; color: var(--ink-soft); }
  .steps li:hover .txt b { color: var(--accent); }
  .steps li { cursor: pointer; }

  .tooltip {
    position: fixed; z-index: 40; max-width: 340px; padding: 11px 13px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip h4 { margin: 0 0 2px; font-size: 13px; }
  .tooltip .file { font-family: var(--mono); font-size: 10.5px; color: var(--accent); word-break: break-all; }
  .tooltip p { margin: 7px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .tooltip .lay { display: inline-block; margin-top: 8px; padding: 1px 7px; border-radius: 20px; font-size: 10.5px; background: color-mix(in srgb, var(--dot) 16%, transparent); color: var(--dot); }
  .tooltip code { background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0 3px; border-radius: 3px; }

  .legend {
    position: absolute; left: 14px; bottom: 14px; z-index: 3;
    display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: min(560px, 70%);
    padding: 9px 12px; background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--dot); }

  .zoom { position: absolute; right: 14px; bottom: 14px; z-index: 3; display: flex; gap: 6px; }
  .zoom .control { background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(8px); width: 32px; padding: 0; justify-content: center; }

  @media (max-width: 980px) {
    .body { flex-direction: column; }
    .canvas { min-height: 52vh; }
    aside.flows { width: auto; max-height: 48vh; border-left: 0; border-top: 1px solid var(--line); }
    .legend { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <strong id="brand-name"></strong>
      <span id="brand-stack"></span>
    </div>
    <span class="stat"><b id="stat-nodes"></b> componentes · <b id="stat-edges"></b> relaciones · <b id="stat-flows"></b> flujos</span>
    <input id="search" class="control" type="search" placeholder="Buscar componente o archivo…" aria-label="Buscar componente" />
    <button id="reset" class="control" type="button">Restablecer</button>
    <button id="fit" class="control" type="button">Ajustar</button>
  </header>

  <div class="body">
    <div class="canvas" id="canvas">
      <div class="viewport" id="viewport">
        <svg id="edges" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button class="control" type="button" data-zoom="-1" aria-label="Alejar">−</button>
        <button class="control" type="button" data-zoom="1" aria-label="Acercar">+</button>
      </div>
    </div>

    <aside class="flows">
      <div class="flows-head">
        <h2>Flujos del sistema</h2>
        <p>Selecciona un flujo para resaltar su ruta completa en el diagrama.</p>
      </div>
      <div class="flows-list" id="flows"></div>
    </aside>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>

  "flows": [
    {
      "id": "f-bootstrap",
      "name": "Arranque y estado inicial",
      "purpose": "Primera carga de la SPA y disparo perezoso de la sincronización inicial.",
      "trigger": "El usuario abre la aplicación",
      "nodes": [
        "browser",
        "main",
        "app-router",
        "app-shell",
        "page-today",
        "api-observatory",
        "worker-fetch",
        "api-router",
        "d1"
      ],
      "edges": [
        "browser->main",
        "main->app-router",
        "app-router->app-shell",
        "app-shell->page-today",
        "page-today->api-observatory",
        "api-observatory->worker-fetch",
        "worker-fetch->api-router",
        "api-router->d1"
      ],
      "steps": [
        {
          "order": 1,
          "node": "browser",
          "action": "Solicita `/`; el entorno de assets devuelve el index (SPA fallback).",
          "from": null,
          "via": null
        },
        {
          "order": 2,
          "node": "main",
          "action": "Monta QueryClient, idioma y router.",
          "from": "browser",
          "via": "browser->main"
        },
        {
          "order": 3,
          "node": "app-router",
          "action": "Redirige `/` a `/today`.",
          "from": "main",
          "via": "main->app-router"
        },
        {
          "order": 4,
          "node": "app-shell",
          "action": "Renderiza navegación, tema y contenedor.",
          "from": "app-router",
          "via": "app-router->app-shell"
        },
        {
          "order": 5,
          "node": "page-today",
          "action": "Pide dashboard, eventos en vivo y tendencia de precios.",
          "from": "app-shell",
          "via": "app-shell->page-today"
        },
        {
          "order": 6,
          "node": "api-observatory",
          "action": "`GET /api/dashboard`, `/api/live-events`, `/api/status`.",
          "from": "page-today",
          "via": "page-today->api-observatory"
        },
        {
          "order": 7,
          "node": "worker-fetch",
          "action": "En `/api/status` encola `ensureInitialSynchronization` con `waitUntil`.",
          "from": "api-observatory",
          "via": "api-observatory->worker-fetch"
        },
        {
          "order": 8,
          "node": "api-router",
          "action": "Resuelve las rutas del observatorio.",
          "from": "worker-fetch",
          "via": "worker-fetch->api-router"
        },
        {
          "order": 9,
          "node": "d1",
          "action": "Lee agregados y eventos ya persistidos.",
          "from": "api-router",
          "via": "api-router->d1"
        }
      ]
    },
    {
      "id": "f-cron",
      "name": "Sincronización programada",
      "purpose": "Refresco automático de fuentes vencidas cada 15 minutos.",
      "trigger": "Cron `*/15 * * * *`",
      "nodes": [
        "scheduled",
        "queue",
        "queue-consumer",
        "external-sync",
        "ext-academic",
        "lib-academic",
        "d1",
        "kv"
      ],
      "edges": [
        "scheduled->queue",
        "queue->queue-consumer",
        "queue-consumer->external-sync",
        "external-sync->ext-academic",
        "external-sync->lib-academic",
        "external-sync->d1",
        "external-sync->kv"
      ],
      "steps": [
        {
          "order": 1,
          "node": "scheduled",
          "action": "Calcula `dueSourceIds()` según la cadencia de cada fuente.",
          "from": null,
          "via": null
        },
        {
          "order": 2,
          "node": "queue",
          "action": "`INDEX_QUEUE.sendBatch()` con un mensaje por fuente.",
          "from": "scheduled",
          "via": "scheduled->queue"
        },
        {
          "order": 3,
          "node": "queue-consumer",
          "action": "Procesa hasta 10 mensajes; `retry()` si falla.",
          "from": "queue",
          "via": "queue->queue-consumer"
        },
        {
          "order": 4,
          "node": "external-sync",
          "action": "`synchronizeSource(sourceId)` ejecuta el adaptador correspondiente.",
          "from": "queue-consumer",
          "via": "queue-consumer->external-sync"
        },
        {
          "order": 5,
          "node": "ext-academic",
          "action": "Ejemplo: consulta los índices académicos públicos.",
          "from": "external-sync",
          "via": "external-sync->ext-academic"
        },
        {
          "order": 6,
          "node": "lib-academic",
          "action": "Normaliza los payloads a `ObservatoryRecord`.",
          "from": "external-sync",
          "via": "external-sync->lib-academic"
        },
        {
          "order": 7,
          "node": "d1",
          "action": "`persistRecords` deduplica por sha256 y actualiza `synchronization_runs`.",
          "from": "external-sync",
          "via": "external-sync->d1"
        },
        {
          "order": 8,
          "node": "kv",
          "action": "Invalida los listados cacheados.",
          "from": "external-sync",
          "via": "external-sync->kv"
        }
      ]
    },
    {
      "id": "f-sync-manual",
      "name": "Sincronización manual por alcance",
      "purpose": "El operador fuerza el refresco de un alcance desde Admin.",
      "trigger": "`POST /api/sync`",
      "nodes": [
        "page-admin",
        "api-observatory",

          "action": "`GET /api/map/global` y `/api/map/countries/:code`.",
          "from": "page-map",
          "via": "page-map->api-observatory"
        },
        {
          "order": 3,
          "node": "worker-fetch",
          "action": "Enruta a la API.",
          "from": "api-observatory",
          "via": "api-observatory->worker-fetch"
        },
        {
          "order": 4,
          "node": "api-router",
          "action": "Delega en el enrutador de módulos.",
          "from": "worker-fetch",
          "via": "worker-fetch->api-router"
        },
        {
          "order": 5,
          "node": "module-router",
          "action": "Coincide con las rutas de mapa.",
          "from": "api-router",
          "via": "api-router->module-router"
        },
        {
          "order": 6,
          "node": "modules-service",
          "action": "Consulta `map_locations`.",
          "from": "module-router",
          "via": "module-router->modules-service"
        },
        {
          "order": 7,
          "node": "lib-geo",
          "action": "Agrega por país y aplica el conjunto LATAM.",
          "from": "modules-service",
          "via": "modules-service->lib-geo"
        },
        {
          "order": 8,
          "node": "d1",
          "action": "Fuente de las ubicaciones y sus proveedores.",
          "from": "modules-service",
          "via": "modules-service->d1"
        }
      ]
    }
  ]
}</script>
<script>
(() => {
  const MODEL = JSON.parse(document.getElementById("model").textContent);
  const layerById = new Map(MODEL.layers.map((l) => [l.id, l]));
  const nodeById = new Map(MODEL.nodes.map((n) => [n.id, n]));

  document.getElementById("brand-name").textContent = MODEL.project.name;
  document.getElementById("brand-stack").textContent = MODEL.project.stack.slice(0, 4).join(" · ");
  document.getElementById("stat-nodes").textContent = MODEL.nodes.length;
  document.getElementById("stat-edges").textContent = MODEL.edges.length;
  document.getElementById("stat-flows").textContent = MODEL.flows.length;
  document.title = MODEL.project.name + " · Mapa de arquitectura";

  const canvas = document.getElementById("canvas");
  const viewport = document.getElementById("viewport");
  const svg = document.getElementById("edges");
  const nodesHost = document.getElementById("nodes");
  const tooltip = document.getElementById("tooltip");

  const W = MODEL.project.canvas.width;
  const H = MODEL.project.canvas.height;
  viewport.style.width = W + "px";
  viewport.style.height = H + "px";
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // --- carriles ---
  for (const layer of MODEL.layers) {
    const first = MODEL.nodes.find((n) => n.layer === layer.id);
    if (!first) continue;
    const label = document.createElement("div");
    label.className = "lane-label";
    label.textContent = layer.label;
    label.style.left = first.x + "px";
    label.style.top = "14px";
    label.style.color = layer.color;
    label.style.opacity = ".85";
    nodesHost.appendChild(label);
  }

  // --- aristas ---
  const edgeEls = new Map();
  const labelEls = new Map();
  const NS = "http://www.w3.org/2000/svg";
  for (const edge of MODEL.edges) {
    const a = nodeById.get(edge.from);
    const b = nodeById.get(edge.to);
    const forward = (a.x + a.width / 2) <= (b.x + b.width / 2);
    const x1 = forward ? a.x + a.width : a.x;
    const y1 = a.y + a.height / 2;
    const x2 = forward ? b.x : b.x + b.width;
    const y2 = b.y + b.height / 2;
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
    const c1 = forward ? x1 + dx : x1 - dx;
    const c2 = forward ? x2 - dx : x2 + dx;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2}`);
    path.setAttribute("class", "edge");
    if (edge.kind === "asincrono") path.setAttribute("stroke-dasharray", "4 4");
    svg.appendChild(path);
    edgeEls.set(edge.id, path);

    if (edge.label) {
      const text = document.createElementNS(NS, "text");
      text.setAttribute("class", "edge-label");
      text.setAttribute("x", (x1 + x2) / 2);
      text.setAttribute("y", (y1 + y2) / 2 - 5);
      text.setAttribute("text-anchor", "middle");
      text.textContent = edge.label;
      svg.appendChild(text);
      labelEls.set(edge.id, text);
    }
  }

  // --- nodos ---
  const nodeEls = new Map();
  for (const node of MODEL.nodes) {
    const layer = layerById.get(node.layer);
    const el = document.createElement("div");
    el.className = "node";
    el.style.cssText = `left:${node.x}px;top:${node.y}px;width:${node.width}px;min-height:${node.height}px;--dot:${layer.color}`;
    el.dataset.id = node.id;
    el.tabIndex = 0;
    const badge = document.createElement("i");
    badge.className = "step-badge";
    el.append(
      Object.assign(document.createElement("b"), { textContent: node.label }),
      Object.assign(document.createElement("small"), { textContent: node.file }),
      badge,
    );
    nodesHost.appendChild(el);
    nodeEls.set(node.id, el);
  }

  // --- leyenda ---
  const legend = document.getElementById("legend");
  for (const layer of MODEL.layers) {
    const span = document.createElement("span");
    span.style.setProperty("--dot", layer.color);
    span.innerHTML = `<i></i>${layer.label}`;
    legend.appendChild(span);
  }

  // --- tooltip ---
  const inline = (text) => text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  let tipNode = null;
  function showTooltip(node, event) {
    const layer = layerById.get(node.layer);
    tooltip.style.setProperty("--dot", layer.color);
    tooltip.innerHTML =
      `<h4>${inline(node.label)}</h4>` +
      `<div class="file">${inline(node.file)}</div>` +
      `<p>${inline(node.description)}</p>` +
      `<span class="lay">${inline(layer.label)}</span>`;
    tooltip.classList.add("show");
    moveTooltip(event);
    tipNode = node.id;
  }
  function moveTooltip(event) {
    const pad = 14;
    const rect = tooltip.getBoundingClientRect();
    let x = event.clientX + pad;
    let y = event.clientY + pad;
    if (x + rect.width > innerWidth - 8) x = event.clientX - rect.width - pad;
    if (y + rect.height > innerHeight - 8) y = event.clientY - rect.height - pad;
    tooltip.style.left = Math.max(8, x) + "px";
    tooltip.style.top = Math.max(8, y) + "px";
  }
  function hideTooltip() { tooltip.classList.remove("show"); tipNode = null; }

  nodesHost.addEventListener("mouseover", (event) => {
    const el = event.target.closest(".node");
    if (!el || el.dataset.id === tipNode) return;
    showTooltip(nodeById.get(el.dataset.id), event);
  });
  nodesHost.addEventListener("mousemove", (event) => { if (tipNode) moveTooltip(event); });
  nodesHost.addEventListener("mouseout", (event) => {
    if (!event.relatedTarget || !event.relatedTarget.closest?.(".node")) hideTooltip();
  });

  // --- resaltado ---
  let activeFlow = null;

  function clearHighlight() {
    for (const el of nodeEls.values()) { el.classList.remove("dim", "active"); el.querySelector(".step-badge").textContent = ""; }
    for (const el of edgeEls.values()) el.classList.remove("dim", "active");
    for (const el of labelEls.values()) el.classList.remove("active");
  }

  function highlightFlow(flow) {
    clearHighlight();
    const stepIndex = new Map();
    flow.steps.forEach((step) => { if (!stepIndex.has(step.node)) stepIndex.set(step.node, step.order); });
    const activeEdges = new Set(flow.edges);
    for (const [id, el] of nodeEls) {
      if (stepIndex.has(id)) {
        el.classList.add("active");
        el.querySelector(".step-badge").textContent = stepIndex.get(id);
      } else el.classList.add("dim");
    }
    for (const [id, el] of edgeEls) el.classList.add(activeEdges.has(id) ? "active" : "dim");
    for (const [id, el] of labelEls) if (activeEdges.has(id)) el.classList.add("active");
  }

  // --- panel de flujos ---
  const flowsHost = document.getElementById("flows");
  MODEL.flows.forEach((flow, index) => {
    const card = document.createElement("div");
    card.className = "flow";
    card.dataset.id = flow.id;

    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-expanded", "false");
    button.innerHTML =
      `<span class="flow-name"><span class="idx">${index + 1}</span>${inline(flow.name)}</span>` +
      `<span class="flow-purpose">${inline(flow.purpose)}</span>` +
      `<span class="flow-trigger">${inline(flow.trigger)}</span>`;

    const steps = document.createElement("ol");
    steps.className = "steps";
    steps.hidden = true;
    for (const step of flow.steps) {
      const node = nodeById.get(step.node);
      const layer = layerById.get(node.layer);
      const li = document.createElement("li");
      li.style.setProperty("--dot", layer.color);
      li.innerHTML =
        `<span class="n">${step.order}</span>` +
        `<span class="txt"><b>${inline(node.label)}</b><span>${inline(step.action)}</span></span>`;
      li.addEventListener("click", (event) => {
        event.stopPropagation();
        focusNode(step.node);
      });
      steps.appendChild(li);
    }

    button.addEventListener("click", () => toggleFlow(flow, card, button, steps));
    card.append(button, steps);
    flowsHost.appendChild(card);
  });

  function toggleFlow(flow, card, button, steps) {
    const open = activeFlow === flow.id;
    for (const other of flowsHost.querySelectorAll(".flow")) {
      other.classList.remove("open");
      other.querySelector("button").setAttribute("aria-expanded", "false");
      other.querySelector(".steps").hidden = true;
    }
    if (open) { activeFlow = null; clearHighlight(); return; }
    activeFlow = flow.id;
    card.classList.add("open");
    button.setAttribute("aria-expanded", "true");
    steps.hidden = false;
    highlightFlow(flow);
    fitTo(flow.steps.map((s) => nodeById.get(s.node)));
    card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  // --- pan y zoom ---
  const view = { x: 0, y: 0, k: 1 };
  function applyView() {
    viewport.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  }
  function fitTo(list) {
    const items = list && list.length ? list : MODEL.nodes;
    const pad = 70;
    const minX = Math.min(...items.map((n) => n.x)) - pad;
    const minY = Math.min(...items.map((n) => n.y)) - pad;
    const maxX = Math.max(...items.map((n) => n.x + n.width)) + pad;
    const maxY = Math.max(...items.map((n) => n.y + n.height)) + pad;
    const rect = canvas.getBoundingClientRect();
    const k = Math.min(rect.width / (maxX - minX), rect.height / (maxY - minY), 1.6);
    // Suelo de legibilidad: por debajo de 0.38 las etiquetas dejan de leerse y
    // es preferible que el usuario desplace el lienzo.
    view.k = Math.max(list && list.length ? 0.15 : 0.38, k);
    view.x = (rect.width - (maxX - minX) * view.k) / 2 - minX * view.k;
    view.y = (rect.height - (maxY - minY) * view.k) / 2 - minY * view.k;
    applyView();
  }
  function focusNode(id) {
    const node = nodeById.get(id);
    fitTo([node]);
    view.k = Math.min(view.k, 1.15);
    applyView();
    const el = nodeEls.get(id);
    el.classList.add("hit");
    setTimeout(() => el.classList.remove("hit"), 1200);
  }

  let drag = null;
  canvas.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".control")) return;
    drag = { x: event.clientX - view.x, y: event.clientY - view.y };
    canvas.classList.add("dragging");
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!drag) return;
    view.x = event.clientX - drag.x;
    view.y = event.clientY - drag.y;
    applyView();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;
    const factor = Math.exp(-event.deltaY * 0.0016);
    const k = Math.min(2.4, Math.max(0.15, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    applyView();
  }, { passive: false });

  for (const button of document.querySelectorAll("[data-zoom]")) {
    button.addEventListener("click", () => {
      const rect = canvas.getBoundingClientRect();
      const px = rect.width / 2;
      const py = rect.height / 2;
      const k = Math.min(2.4, Math.max(0.15, view.k * (Number(button.dataset.zoom) > 0 ? 1.25 : 0.8)));
      view.x = px - (px - view.x) * (k / view.k);
      view.y = py - (py - view.y) * (k / view.k);
      view.k = k;
      applyView();
    });
  }

  // --- nodo: clic y búsqueda ---
  nodesHost.addEventListener("click", (event) => {
    const el = event.target.closest(".node");
    if (!el) return;
    const id = el.dataset.id;
    clearHighlight();
    activeFlow = null;
    for (const other of flowsHost.querySelectorAll(".flow")) {
      other.classList.remove("open");
      other.querySelector(".steps").hidden = true;
      other.querySelector("button").setAttribute("aria-expanded", "false");
    }
    const related = MODEL.edges.filter((e) => e.from === id || e.to === id);
    const keep = new Set([id, ...related.map((e) => e.from), ...related.map((e) => e.to)]);
    const keepEdges = new Set(related.map((e) => e.id));
    for (const [nid, nel] of nodeEls) if (!keep.has(nid)) nel.classList.add("dim");
    nodeEls.get(id).classList.add("active");
    for (const [eid, eel] of edgeEls) eel.classList.add(keepEdges.has(eid) ? "active" : "dim");
    for (const [eid, lel] of labelEls) if (keepEdges.has(eid)) lel.classList.add("active");
  });

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    const term = search.value.trim().toLowerCase();
    if (!term) { if (!activeFlow) clearHighlight(); return; }
    clearHighlight();
    activeFlow = null;
    for (const [id, el] of nodeEls) {
      const node = nodeById.get(id);
      const hit = (node.label + " " + node.file + " " + node.description).toLowerCase().includes(term);
      el.classList.add(hit ? "active" : "dim");
    }
    for (const el of edgeEls.values()) el.classList.add("dim");
  });

  document.getElementById("reset").addEventListener("click", () => {
    search.value = "";
    activeFlow = null;
    clearHighlight();
    for (const other of flowsHost.querySelectorAll(".flow")) {
      other.classList.remove("open");
      other.querySelector(".steps").hidden = true;
      other.querySelector("button").setAttribute("aria-expanded", "false");
    }
    fitTo(null);
  });
  document.getElementById("fit").addEventListener("click", () => fitTo(null));

  addEventListener("keydown", (event) => {
    if (event.key === "Escape") document.getElementById("reset").click();
  });
  addEventListener("resize", () => { if (!activeFlow) fitTo(null); });

  fitTo(null);
})();
</script>
</body>
</html>
